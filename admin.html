<!doctype html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — SAM MOBIL</title><link rel="stylesheet" href="admin.css"></head><body><main class="wrap"><section id="loginView" class="login"><div class="logo">SAM <b>MOBIL</b></div><h1>Admin SAM MOBIL</h1><p>Kelola katalog dan stok kendaraan.</p><form id="loginForm"><input id="username" placeholder="Username" required><input id="password" type="password" placeholder="Password" required><button>Masuk</button><div id="loginError"></div></form></section><section id="adminView" class="hidden"><header class="head"><div><div class="logo">SAM <b>MOBIL</b></div><h1>Kelola Stok</h1></div><div><button id="addBtn">+ Tambah Mobil</button><button id="logoutBtn" class="light">Keluar</button></div></header><div class="panel"><table><thead><tr><th>Mobil</th><th>Tahun</th><th>Harga</th><th>Status</th><th>Aksi</th></tr></thead><tbody id="adminRows"></tbody></table></div></section></main><div id="drawer" class="drawer hidden"><div class="drawer-card"><button id="drawerClose" class="x">×</button><h2 id="formTitle">Tambah Mobil</h2><form id="carForm"><input id="carId" type="hidden"><label>Merek<input id="brand" required></label><label>Nama<input id="name" required></label><label>Model<input id="model"></label><div class="two"><label>Tahun<input id="year" type="number"></label><label>Kilometer<input id="km"></label></div><div class="two"><label>Harga<input id="price" type="number"></label><label>Status<select id="status"><option>Tersedia</option><option>Stok Habis</option></select></label></div><div class="two"><label>Transmisi<input id="transmission"></label><label>Warna<input id="color"></label></div><div class="photo-upload">
<label class="photo-label">Foto Mobil</label>
<div id="dropZone" class="drop-zone">
  <input id="photoInput" type="file" accept="image/jpeg,image/png,image/webp" multiple hidden>
  <div class="drop-icon">📷</div>
  <strong>Drag & Drop foto di sini</strong>
  <span>atau</span>
  <button type="button" id="choosePhotos" class="choose-btn">Pilih dari perangkat</button>
  <small>Maksimal 10 foto • JPG, PNG, WebP</small>
</div>
<div id="photoPreview" class="photo-preview"></div>
</div>
<textarea id="photos" hidden></textarea><label>Deskripsi<textarea id="description" rows="4"></textarea></label><button class="save">Simpan Mobil</button></form></div></div><script src="admin.js"></script><script>const dz=document.getElementById("dropZone"),pi=document.getElementById("photoInput"),cp=document.getElementById("choosePhotos"),pv=document.getElementById("photoPreview"),pt=document.getElementById("photos");let picked=[];function draw(){pv.innerHTML=picked.map((s,i)=>'<div class="photo-item"><img src="'+s+'"><button type="button" data-i="'+i+'">×</button>'+(i===0?'<span class="main-tag">UTAMA</span>':'')+'</div>').join("");pt.value=picked.join("\n");pv.querySelectorAll("button").forEach(b=>b.onclick=()=>{picked.splice(+b.dataset.i,1);draw()})}function add(fs){[...fs].slice(0,10-picked.length).forEach(f=>{if(!["image/jpeg","image/png","image/webp"].includes(f.type))return;const r=new FileReader();r.onload=e=>{picked.push(e.target.result);draw()};r.readAsDataURL(f)})}cp.onclick=e=>{e.stopPropagation();pi.click()};dz.onclick=e=>{if(e.target!==cp)pi.click()};pi.onchange=e=>add(e.target.files);dz.ondragover=e=>{e.preventDefault();dz.classList.add("dragover")};dz.ondragleave=()=>dz.classList.remove("dragover");dz.ondrop=e=>{e.preventDefault();dz.classList.remove("dragover");add(e.dataTransfer.files)};document.getElementById("addBtn").addEventListener("click",()=>{picked=[];draw()});</script></body></html>
