<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reset Password — SAM MOBIL</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#101828;font-family:Inter,system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:20px}
.card{width:min(430px,100%);background:#fff;padding:34px;border-radius:18px;box-shadow:0 15px 50px #10182812}
.logo{text-align:center;margin-bottom:18px}.logo img{width:min(250px,100%);height:auto;max-height:78px;object-fit:contain}
h1{margin:8px 0 6px;text-align:center}.sub{text-align:center;color:#667085;font-size:14px;line-height:1.5;margin:0 0 24px}
form{display:grid;gap:12px}label{font-size:13px;font-weight:700}input{width:100%;padding:12px;border:1px solid #d0d5dd;border-radius:9px;font:inherit;margin-top:6px}
button{border:0;background:#e31b23;color:#fff;padding:12px 17px;border-radius:9px;font-weight:800;cursor:pointer}
button:disabled{opacity:.6;cursor:not-allowed}.msg{font-size:13px;line-height:1.5;padding:10px;border-radius:9px;display:none}.msg.ok{display:block;background:#ecfdf3;color:#067647}.msg.err{display:block;background:#fef3f2;color:#b42318}
.back{text-align:center;margin-top:18px;font-size:13px}.back a{color:#0869bd;text-decoration:none;font-weight:700}.hidden{display:none!important}
</style>
</head>
<body>
<main class="card">
  <div class="logo"><img src="sam-logo.png" alt="SAM MOBIL"></div>
  <h1 id="title">Reset Password</h1>
  <p id="subtitle" class="sub">Masukkan email admin untuk menerima link penggantian password.</p>

  <form id="requestForm">
    <label>Email Admin<input id="requestEmail" type="email" value="pradiptaachmad35@gmail.com" required></label>
    <button id="requestBtn">Kirim Link Reset</button>
    <div id="requestMsg" class="msg"></div>
  </form>

  <form id="changeForm" class="hidden">
    <label>Password Baru<input id="newPassword" type="password" minlength="8" placeholder="Minimal 8 karakter" required></label>
    <label>Konfirmasi Password<input id="confirmPassword" type="password" minlength="8" required></label>
    <button id="changeBtn">Simpan Password Baru</button>
    <div id="changeMsg" class="msg"></div>
  </form>

  <div class="back"><a href="admin.html">← Kembali ke Admin SAM MOBIL</a></div>
</main>
<script src="config.js"></script>
<script>
const SUPA_URL=window.SAM_CONFIG.SUPABASE_URL;
const SUPA_KEY=window.SAM_CONFIG.SUPABASE_ANON_KEY;
const headers={apikey:SUPA_KEY,"Content-Type":"application/json"};
const requestForm=document.getElementById('requestForm');
const changeForm=document.getElementById('changeForm');
const requestMsg=document.getElementById('requestMsg');
const changeMsg=document.getElementById('changeMsg');
const title=document.getElementById('title');
const subtitle=document.getElementById('subtitle');

function showChangeForm(){
  requestForm.classList.add('hidden');
  changeForm.classList.remove('hidden');
  title.textContent='Buat Password Baru';
  subtitle.textContent='Masukkan password baru untuk akun admin SAM MOBIL.';
}
function message(el,text,type){el.textContent=text;el.className='msg '+type}

const hash=new URLSearchParams(location.hash.substring(1));
const accessToken=hash.get('access_token');
const errorCode=hash.get('error_code');
const errorDescription=hash.get('error_description');
if(accessToken && hash.get('type')==='recovery') showChangeForm();
if(errorCode) message(requestMsg,errorDescription||'Link reset tidak valid atau sudah kedaluwarsa.','err');

requestForm.addEventListener('submit',async e=>{
  e.preventDefault();
  const btn=document.getElementById('requestBtn');btn.disabled=true;
  message(requestMsg,'','');
  const email=document.getElementById('requestEmail').value.trim();
  const redirectTo=location.origin+'/reset-password.html';
  try{
    const res=await fetch(SUPA_URL+'/auth/v1/recover',{method:'POST',headers,body:JSON.stringify({email,redirect_to:redirectTo})});
    const data=await res.json().catch(()=>({}));
    btn.disabled=false;
    if(!res.ok){
      message(requestMsg,data.msg||data.message||data.error_description||'Gagal mengirim link reset.','err');
      return;
    }
  }catch(err){
    btn.disabled=false;
    message(requestMsg,'Tidak dapat terhubung ke Supabase.','err');
    return;
  }
  message(requestMsg,'Link reset sudah dikirim. Buka email terbaru dan klik tombol reset. Link lama jangan digunakan.','ok');
});

changeForm.addEventListener('submit',async e=>{
  e.preventDefault();
  const btn=document.getElementById('changeBtn');
  const password=document.getElementById('newPassword').value;
  const confirm=document.getElementById('confirmPassword').value;
  if(password.length<8){message(changeMsg,'Password minimal 8 karakter.','err');return}
  if(password!==confirm){message(changeMsg,'Konfirmasi password tidak sama.','err');return}
  btn.disabled=true;
  if(!accessToken){
    btn.disabled=false;
    message(changeMsg,'Sesi reset tidak ditemukan. Buka link reset terbaru dari email.','err');
    return;
  }
  try{
    const res=await fetch(SUPA_URL+'/auth/v1/user',{method:'PUT',headers:{...headers,Authorization:'Bearer '+accessToken},body:JSON.stringify({password})});
    const data=await res.json().catch(()=>({}));
    btn.disabled=false;
    if(!res.ok){message(changeMsg,data.msg||data.message||'Password gagal diubah.','err');return}
    message(changeMsg,'Password berhasil diubah. Mengalihkan ke halaman admin...','ok');
    setTimeout(()=>location.href='admin.html',1000);
  }catch(err){
    btn.disabled=false;
    message(changeMsg,'Tidak dapat terhubung ke Supabase.','err');
  }
});
</script>
</body>
</html>
